<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور مدارس الأحد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f5f0; --card:#fff; --fg:#1f2a2a; --muted:#6b7473; --line:#e2e0d8;
  --accent:#1d4f5c; --onaccent:#fff; --num:#f3d34a; --numfg:#3d3200;
  --yes:#1e7b45; --yesbg:#dff3e6; --no:#a03a35; --nobg:#fbeceb; --warn:#8a5a00; --warnbg:#fdf1d8;
  --font:-apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121817; --card:#1a2221; --fg:#e8ecea; --muted:#9aa5a3; --line:#2a3533;
  --accent:#7fc3d1; --onaccent:#0d1d21; --num:#5a4a10; --numfg:#ffe68a;
  --yes:#7fd8a0; --yesbg:#16382a; --no:#f0a29d; --nobg:#3a1f1d; --warn:#f3c86b; --warnbg:#3a2e12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left))}
header{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:14px 0 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top);background:var(--bg);z-index:10}
.top>div:first-child{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.count{font-variant-numeric:tabular-nums;text-align:center;background:var(--yesbg);color:var(--yes);border-radius:12px;padding:6px 12px;min-width:84px}
.count b{display:block;font-size:22px;line-height:1.2}
.count span{font-size:12px}
.controls{display:flex;gap:8px}
select,input{font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 10px;min-width:0}
.controls select{flex:0 1 auto;max-width:60%}
.controls input{flex:1 1 0;width:0}
#keyIn{width:100%;height:52px;font-size:22px;text-align:center;letter-spacing:2px}
.ver{font-size:11px;color:var(--muted);text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.status.ok{background:var(--yesbg);color:var(--yes)}
.status.wait{background:var(--warnbg);color:var(--warn)}
.status.err{background:var(--nobg);color:var(--no)}
.status.lock{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.row.locked{cursor:default}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:54px;cursor:pointer;user-select:none;-webkit-user-select:none}
.n{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--num);color:var(--numfg);display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0;font-size:17px;font-weight:500}
.st{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--no);background:var(--nobg);border-radius:999px;padding:4px 12px}
.row.on{background:var(--yesbg);border-color:var(--yes)}
.row.on .st{color:var(--yesbg);background:var(--yes)}
.bar{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
button{font:inherit;font-weight:600;border-radius:12px;height:48px;padding:0 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.editbtn{flex:1;font-size:16px;background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-variant-numeric:tabular-nums}
.editbtn.open{background:var(--yesbg);color:var(--yes);border-color:var(--yes)}
.sendbtn{flex:0 0 auto}
.row.ro{cursor:default}
.hint{animation:hint .5s}
@keyframes hint{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
.seg{height:40px;min-width:52px;padding:0 10px;font-size:15px;border-radius:10px;background:var(--card);color:var(--muted)}
.seg.yes.on{background:var(--yes);color:var(--yesbg);border-color:var(--yes)}
.seg.no.on{background:var(--no);color:var(--nobg);border-color:var(--no)}
.seg.mid.on{background:var(--warn);color:var(--warnbg);border-color:var(--warn)}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;display:grid;gap:6px}
.scard.ro .seg{cursor:default}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px}
.notes{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px}
.trow{display:flex;align-items:center;gap:8px}
.trow .tname{flex:1;min-width:0;font-size:16px;font-weight:500}
.trow.exc{border-top:1px dashed var(--line);padding-top:6px}
.trow.exc .seg{min-width:0;font-size:13px}
.trow.need .tname{color:var(--no)}
.excbanner{width:100%;height:auto;min-height:44px;background:var(--warnbg);color:var(--warn);border-color:var(--warn);font-size:14px;padding:8px 12px}
.exrow{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.exrow span{display:block;font-size:13px;color:var(--muted)}
.exbtns{display:flex;gap:8px}.exbtns .seg{flex:1;font-size:14px}
#sExcList{display:grid;gap:8px}
.hh{font-size:15px;color:var(--muted);margin:18px 0 6px}
.hscroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.htab{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.htab th,.htab td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.htab th{color:var(--muted);font-weight:600}
.htab .hy{color:var(--yes);font-weight:600}.htab .hn{color:var(--no);font-weight:600}
.htab tr.sum td{background:var(--bg);font-size:12px}
#staff .sh{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:14px 0 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:1px solid var(--line)}
.primary{flex:1;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.setup{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.setup h2{margin:0;font-size:18px}
.setup p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.link{height:auto;padding:0;border:0;background:none;color:var(--accent);font-size:13px;font-weight:500;text-decoration:underline;cursor:pointer}
.err-text{color:var(--no);font-size:13px;min-height:1em}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.chip{height:32px;margin-top:8px;padding:0 12px;font-size:13px;border-radius:999px;border-color:var(--accent);color:var(--accent);background:var(--card)}
.nmw{flex:1;min-width:0;display:grid;gap:3px;padding-block:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags:empty{display:none}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px}
.tag.bday{background:var(--warnbg);color:var(--warn)}
.tag.miss{background:var(--nobg);color:var(--no)}
.row.on .tag.miss{display:none}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 0 0}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:10px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:18px;color:var(--accent)}
.sheet h3{margin:10px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.plist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.plist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.plist b{font-size:16px}
.plist span{font-size:13px;color:var(--muted)}
.none{margin:4px 0 0;color:var(--muted);font-size:14px}
.cake{font-size:44px;text-align:center;line-height:1}
.center{align-items:center;padding:16px}
.center .sheet{border-radius:18px;max-width:420px}
</style>
</head>
<body>
<div class="wrap">

  <section id="setup" class="setup" hidden>
    <h2>تشغيل أول مرة</h2>
    <p>اكتب كود الفصل اللي خدته من أمين الخدمة. كل فصل ليه كود مختلف. محتاج نت المرة دي بس عشان أسماء الأطفال تنزل على الموبايل.</p>
    <input id="keyIn" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="numeric" enterkeyhint="go" dir="ltr" placeholder="كود الفصل" aria-label="كود الفصل">
    <div id="setupErr" class="err-text"></div>
    <button id="setupBtn" class="primary" type="button">ابدأ</button>
    <div class="ver" id="ver"></div>
  </section>

  <section id="staff" hidden></section>

  <section id="main" hidden>
    <header>
      <div class="top">
        <div>
          <h1 id="title">حضور الفصل</h1>
          <div class="sub">دوس على اسم الطفل يبقى حاضر · <button id="switchBtn" class="link" type="button">تغيير الفصل</button></div>
          <button id="followBtn" class="chip" type="button">متابعة</button>
        </div>
        <div class="count" aria-live="polite"><b id="cnt">0</b><span>من <span id="tot">0</span> حاضر</span></div>
      </div>
      <div class="controls">
        <select id="date" aria-label="تاريخ الخدمة"></select>
        <input id="q" type="search" placeholder="دوّر على اسم" aria-label="دوّر على اسم">
      </div>
      <div id="status" class="status ok" role="status"><span class="dot"></span><span id="statusText" style="flex:1;min-width:0">جاهز</span><button id="refreshBtn" class="link" type="button" style="color:inherit">تحديث</button></div>
    </header>
    <ul id="list"></ul>
  </section>
</div>

<div class="overlay center" id="bdayPop" hidden role="dialog" aria-modal="true" aria-labelledby="bdayTitle">
  <div class="sheet">
    <div class="cake" aria-hidden="true">🎂</div>
    <h2 id="bdayTitle" style="text-align:center">عيد ميلاد الأسبوع ده</h2>
    <ul class="plist" id="bdayList"></ul>
    <button id="bdayOk" class="primary" type="button">تمام</button>
  </div>
</div>

<div class="overlay" id="followPop" hidden role="dialog" aria-modal="true" aria-label="متابعة">
  <div class="sheet">
    <div class="hd"><h2>متابعة الفصل</h2><button id="followClose" type="button" style="height:40px">قفل</button></div>
    <div id="followBody"></div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <button id="editBtn" class="editbtn" type="button" aria-pressed="false">🔒 دوس هنا عشان تعدّل</button>
    <button id="syncBtn" class="sendbtn" type="button" hidden>ابعت للشيت</button>
  </div>
</div>

<script src="config.js"></script>
<script src="staff.js"></script>
<script src="app.js"></script>
</body>
</html>
